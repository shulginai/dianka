<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>С Днём Святого Валентина ❤️</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffdde1 0%, #ffb6c1 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px; /* гарантированный отступ от краёв */
            margin: 0;
            position: relative;
            overflow-x: hidden;
        }

        /* Основной контейнер-карточка */
        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.7); /* более плотный фон */
            backdrop-filter: blur(3px);
            border-radius: 60px;
            padding: 25px 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15); /* тень для объёма */
        }

        /* Адаптация для совсем маленьких экранов */
        @media (max-width: 380px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px 10px;
            }
            .title-text {
                font-size: 1.5rem !important;
            }
            .heart-wrapper {
                max-width: 280px !important;
            }
            .counter {
                font-size: 1.2rem !important;
                padding: 8px 16px !important;
            }
        }

        /* Центрируем всё внутри обычного режима */
        #normalMode {
            text-align: center;
            width: 100%;
        }

        .title-text {
            font-size: 1.8rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 15px #ff1a4c, 0 0 30px #ff4d6d;
            margin-bottom: 15px;
            animation: softPulse 2s ease-in-out infinite;
            white-space: nowrap;
            padding: 0 5px;
        }

        @keyframes softPulse {
            0% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 25px #ff4d6d, 0 0 50px #ff1a4c; }
            100% { transform: scale(1); opacity: 0.9; }
        }

        .heart-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;
            max-width: 380px;
            margin: 5px auto; /* центрирование */
            cursor: pointer;
            position: relative;
            user-select: none;
            -webkit-touch-callout: none;
        }

        .heart-mask {
            width: 100%;
            height: 100%;
            position: relative;
            -webkit-mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 88.9L16.2 55.3C7.3 46.4 7.3 32 16.2 23.1s23.3-8.9 32.2 0L50 24.5l1.6-1.4c8.9-8.9 23.3-8.9 32.2 0 8.9 8.9 8.9 23.3 0 32.2L50 88.9z" fill="black"/></svg>');
            mask-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M50 88.9L16.2 55.3C7.3 46.4 7.3 32 16.2 23.1s23.3-8.9 32.2 0L50 24.5l1.6-1.4c8.9-8.9 23.3-8.9 32.2 0 8.9 8.9 8.9 23.3 0 32.2L50 88.9z" fill="black"/></svg>');
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-position: center;
            mask-position: center;
            background: #ff4d6d;
            box-shadow: 0 20px 30px rgba(180, 30, 60, 0.5);
        }

        .heart-mask img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .pulse {
            animation: clickPulse 0.3s ease;
        }

        @keyframes clickPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Стили для взрыва */
        .explosion-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 70vh;
            padding: 30px 0;
        }

        .explosion-text {
            font-size: 3.5rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 0 20px #ff1a4c, 0 0 40px #ff4d6d;
            text-align: center;
            line-height: 1.3;
            word-break: break-word;
            max-width: 100%;
            padding: 20px;
            position: relative;
            z-index: 10;
            animation: glow 2s infinite alternate;
        }

        @media (max-width: 380px) {
            .explosion-text {
                font-size: 2.8rem;
            }
        }

        @keyframes glow {
            from { text-shadow: 0 0 20px #ff1a4c, 0 0 40px #ff4d6d; }
            to { text-shadow: 0 0 30px #ff4d6d, 0 0 70px #ff1a4c; }
        }

        .floating-hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .floating-heart {
            position: absolute;
            font-size: 1.8rem;
            opacity: 0.8;
            animation: floatSlow 12s infinite alternate ease-in-out;
            filter: drop-shadow(0 5px 5px rgba(255, 80, 120, 0.3));
            will-change: transform;
        }

        @keyframes floatSlow {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(30px, -20px) rotate(10deg); }
            50% { transform: translate(-20px, 30px) rotate(-5deg); }
            75% { transform: translate(15px, -25px) rotate(8deg); }
            100% { transform: translate(-10px, 15px) rotate(-3deg); }
        }

        /* Счётчик нажатий: блочный, центрированный */
        .counter {
            display: block;
            width: fit-content;
            margin: 20px auto 0 auto; /* центрирование */
            text-align: center;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 1.4rem;
            color: #b3406c;
            border: 2px solid white;
            font-weight: 600;
            box-shadow: 0 5px 0 #e198aa;
        }

        .float-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .float-item {
            position: absolute;
            font-size: 2rem;
            font-weight: 500;
            animation: flyAway 2.5s ease-out forwards;
            filter: drop-shadow(0 5px 5px rgba(0,0,0,0.2));
            white-space: nowrap;
            --dx: 0px;
            --dy: 0px;
        }

        @keyframes flyAway {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--dx), var(--dy)) scale(0.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

</html>
